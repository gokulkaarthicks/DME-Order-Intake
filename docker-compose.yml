services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dme}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dme}
      POSTGRES_DB: ${POSTGRES_DB:-dme_order_intake}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dme} -d ${POSTGRES_DB:-dme_order_intake}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
